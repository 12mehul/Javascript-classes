      async function fetchMultipleUsers(userIds) {
        try {
          console.log("Fetching user data...");

          // Fetch all users in parallel using Promise.all
          const userResponses = await Promise.all(
            userIds.map((id) =>
              fetch(`https://jsonplaceholder.typicode.com/users/${id}`)
            )
          );

          // Convert all responses to JSON
          const users = await Promise.all(
            userResponses.map((res) => res.json())
          );
          console.log("Users Data:", users);

          // Fetch posts for all users in parallel
          const postResponses = await Promise.all(
            users.map((user) =>
              fetch(
                `https://jsonplaceholder.typicode.com/posts?userId=${user.id}`
              )
            )
          );

          // Convert post responses to JSON
          const posts = await Promise.all(
            postResponses.map((res) => res.json())
          );
          console.log("Users' Posts:", posts);

          console.log("API calls complete!");
        } catch (error) {
          console.log("Error:", error);
        }
      }

      // Fetch data for users with IDs 1, 2, and 3
      fetchMultipleUsers([1, 2, 3]);
